<mat-sidenav-container class="!bg-transparent flex h-full">

    <mat-sidenav mode="side" class="bg-gray-300 mt-2 mb-2" [opened]="sidenav.sidenavAperta">
        <div class="flex flex-col items-center justify-center p-3">
            <div class="flex flex-col justify-around mt-5 bg-blue-50 rounded-xl shadow-xl p-3 mb-5">
                <h2 class="font-extrabold text-xl text-center ">Che cos'è CityShare Hub?</h2>
                <h3 class="font-bold text-center text-lg ">Trasforma la Tua Città</h3>
                <span class="text-center text-lg mt-5">
                    Condividi idee, segnalazioni e progetti per: <br>
                    ✨ Proteggere patrimonio culturale/naturale <br>
                    🌿 Rafforzare legami sociali/ambientali <br>
                    🆓 Gratis per tutti i cittadini attivi
                </span>
            </div>
            <mat-divider class="w-full"></mat-divider>

            <p class="mt-5 text-xl font-bold">Vai a:</p>
            <button matButton="filled" class="mt-5 w-40 shadow-xl" routerLink="/dashboard/lista-utenti">Lista Utenti</button>
            <button matButton="filled" class="mt-5 w-40 shadow-xl" routerLink="/dashboard/lista-post">Lista Post</button>
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
