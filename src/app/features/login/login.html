        <div cardDashboard class="flex flex-col items-center h-full p-15 m-5">
            <h2 class="font-bold text-xl m-3 text-blue-900">Login Dashboard CityShare Hub</h2>
            <a href="https://gorest.co.in/consumer/login" target="_blank" class="my-3 bg-gradient-to-r from-green-300 to-blue-300  p-3 rounded-xl">
                <strong>Clicca Qui</strong> qui per avere il tuo Token</a>
                <p class="m-3 text-md text-gray-500">Inserisci il tuo token ed entra nella piattaforma</p>
            <div class="w-full margin mt-3">
                <form #authForm="ngForm" (ngSubmit)="invioToken(authForm)">
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-label>Token di Autorizzazione</mat-label>
                        <input matInput type="text" name="token" ngModel required>
                    </mat-form-field>
                    <button matButton="filled" type="submit" [disabled]="!authForm.valid" class="{{authForm.valid ? '!bg-gradient-to-r from-green-300 to-blue-300 !text-gray-800' : ''}} w-full">Accedi</button>
                </form>
            </div>
            
        </div>
    
</div>
